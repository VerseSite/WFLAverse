services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-db-password}
    volumes:
      - campus_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-demo-only-change-before-deployment}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
      POSTGRES_HOST: db
      POSTGRES_DB: campus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-db-password}
      SITE_NAME: ${SITE_NAME:-WFLA VERSE}
      ADMIN_CONTACT: ${ADMIN_CONTACT:-请联系校园网管理员，并提供你的姓名、班级和学号。}
    depends_on:
      db:
        condition: service_healthy

volumes:
  campus_db:
