{% if form.non_field_errors %}<div class="verse-errors" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  <div class="field{% if field.errors %} has-errors{% endif %}">
    <label class="label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="faint text-[12px] ml-1">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="hint mt-2">{{ field.help_text }}</div>{% endif %}
    {% if field.errors %}<div class="verse-errors mt-2" role="alert">{{ field.errors }}</div>{% endif %}
  </div>
{% endfor %}
